<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#f3f7fb;font-family:Arial,sans-serif;color:#17324a}.box{max-width:1150px;margin:25px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0001}h1{text-align:center;color:#07579a;font-size:22px;line-height:1.4}.login{max-width:380px;margin:35px auto}.login input,.search{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccd8e2;border-radius:8px}.login button{width:100%}button{background:#0876c9;color:white;border:0;border-radius:8px;padding:11px 18px;font-weight:bold;cursor:pointer}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef5fa;padding:15px;text-align:center;border-radius:9px}.stat b{display:block;font-size:24px}.toolbar{display:flex;gap:8px;margin:18px 0}.toolbar .search{flex:1;margin:0}.card{border:1px solid #dce4ea;border-radius:10px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccd8e2;border-radius:7px}.paid{color:green;font-weight:bold}.notpaid{color:#c00;font-weight:bold}.links{margin:10px 0}.links a{margin-right:15px;color:#07579a}.error{color:#b00020;margin:10px 0;font-weight:bold}.readonly{background:#f4f4f4}.small{font-size:12px;color:#667}.success{color:green}@media(max-width:700px){.box{margin:0;border-radius:0}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><div class="box">
<h1>KMCT COLLEGE OF ENGINEERING FOR EMERGING TECHNOLOGIES AND MANAGEMENT<br>REGISTRATION OFFICE</h1>
<div id="login" class="login"><h3>Registration Office Login</h3><p class="small">Enter the office credentials supplied by the administrator.</p><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" onclick="login()">LOGIN</button><div id="loginError" class="error"></div><p id="connection" class="small"></p></div>
<div id="dashboard" class="hidden">
<div class="stats"><div class="stat">Total Students<b id="total">0</b></div><div class="stat">Paid<b id="paid">0</b></div><div class="stat">Not Paid<b id="notPaid">0</b></div><div class="stat">Completed<b id="completed">0</b></div></div>
<div class="toolbar"><input class="search" id="query" placeholder="Search name / ID / course / mobile / admission / register no."><button onclick="searchStudents()">SEARCH</button><button onclick="allStudents()">ALL</button><button onclick="logout()">LOGOUT</button></div><div id="results"></div></div>
</div>
<script>
var loggedIn=false;
function unavailable(){return typeof google==='undefined'||!google.script||!google.script.run;}
function login(){
  var err=document.getElementById('loginError');err.textContent='';
  if(unavailable()){err.textContent='ERROR: This page is not running inside Google Apps Script. Open the deployed Web App URL ending in /exec?page=office.';return;}
  var u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;
  if(!u||!p){err.textContent='Please enter username and password.';return;}
  var b=document.getElementById('loginBtn');b.disabled=true;b.textContent='CHECKING...';
  google.script.run.withSuccessHandler(function(r){b.disabled=false;b.textContent='LOGIN';if(r&&r.success){loggedIn=true;document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');refresh();searchStudents();}else{err.textContent=(r&&r.message)||'Invalid username or password.';}}).withFailureHandler(function(e){b.disabled=false;b.textContent='LOGIN';err.textContent='Server error: '+(e&&e.message?e.message:e);}).officeLogin(u,p);
}
function refresh(){google.script.run.withSuccessHandler(function(s){document.getElementById('total').textContent=s.total;document.getElementById('paid').textContent=s.paid;document.getElementById('notPaid').textContent=s.notPaid;document.getElementById('completed').textContent=s.completed;}).withFailureHandler(function(e){alert('ERROR: '+e.message);}).getOfficeStats();}
function allStudents(){document.getElementById('query').value='';searchStudents();}
function searchStudents(){if(!loggedIn)return;google.script.run.withSuccessHandler(render).withFailureHandler(function(e){alert('ERROR: '+e.message);}).searchStudents(document.getElementById('query').value);}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];});}
function render(a){var out=document.getElementById('results');if(!a||!a.length){out.innerHTML='<p>No records found.</p>';return;}out.innerHTML=a.map(function(x,i){var p=x.paymentStatus==='Paid'?'paid':'notpaid';return '<div class="card"><b>'+esc(x.studentName)+'</b> — '+esc(x.course)+' — '+esc(x.semester)+'<br><small>Submission ID: '+esc(x.id)+' | Mobile: '+esc(x.studentMobile)+' | Payment: <span class="'+p+'">'+esc(x.paymentStatus)+'</span></small><div class="grid" style="margin-top:10px"><input id="adm'+i+'" placeholder="Admission Number" value="'+esc(x.admission)+'"><input id="reg'+i+'" placeholder="University Register Number" value="'+esc(x.regno)+'"></div><div class="links">'+(x.photoUrl?'<a target="_blank" rel="noopener" href="'+esc(x.photoUrl)+'">View Photo</a>':'')+(x.signatureUrl?'<a target="_blank" rel="noopener" href="'+esc(x.signatureUrl)+'">View Signature</a>':'')+'</div><button onclick="saveRecord(\''+String(x.id).replace(/'/g,"\\'")+'\','+i+')">SAVE OFFICE DETAILS</button></div>';}).join('');}
function saveRecord(id,i){google.script.run.withSuccessHandler(function(){alert('Saved successfully. Payment status was not changed.');refresh();searchStudents();}).withFailureHandler(function(e){alert('ERROR: '+e.message);}).updateOfficeRecord(id,document.getElementById('adm'+i).value,document.getElementById('reg'+i).value);}
function logout(){location.href=location.pathname;}
window.addEventListener('load',function(){if(unavailable()){document.getElementById('connection').textContent='Not connected to Apps Script. Use the deployed /exec?page=office URL.';}else{google.script.run.withSuccessHandler(function(){document.getElementById('connection').textContent='Connection OK.';}).withFailureHandler(function(){document.getElementById('connection').textContent='Apps Script connection failed.';}).ping();}document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')login();});});
</script></body></html>
