<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f3f7fb;margin:0;color:#18324b}.wrap{max-width:1200px;margin:25px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0001}
h1{text-align:center;color:#0b4f8a;font-size:22px}.login{max-width:380px;margin:35px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{padding:10px;border:1px solid #ccd8e2;border-radius:7px;width:100%;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:7px;background:#0b66b2;color:#fff;font-weight:bold;cursor:pointer}
.hidden{display:none}.toolbar{display:flex;gap:10px;margin:20px 0}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}th{background:#eaf3fb}.paid{color:green;font-weight:bold}.notpaid{color:#c00;font-weight:bold}
.card{border:1px solid #ddd;border-radius:10px;padding:15px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head>
<body><div class="wrap">
<h1>KMCT COLLEGE OF ENGINEERING FOR EMERGING TECHNOLOGIES AND MANAGEMENT<br>REGISTRATION OFFICE</h1>
<div id="login" class="login"><h2>Office Login</h2><input id="user" placeholder="Username"><br><br><input id="pass" type="password" placeholder="Password"><br><br><button onclick="login()">LOGIN</button></div>
<div id="dash" class="hidden"><div class="toolbar"><input id="q" placeholder="Search student name / submission ID / course"><button onclick="search()">SEARCH</button><button onclick="logout()">LOGOUT</button></div><div id="results"></div></div>
</div>
<script>
function login(){google.script.run.withSuccessHandler(ok=>{if(ok){loginDiv.style.display='none';dash.classList.remove('hidden');search()}else alert('Invalid login details')}).officeLogin(user.value,pass.value)}
function logout(){location.reload()}
function search(){google.script.run.withSuccessHandler(show).searchStudents(q.value)}
function show(rows){if(!rows.length){results.innerHTML='<p>No records found.</p>';return}results.innerHTML=rows.map((r,i)=>`
<div class="card"><b>${esc(r.studentName)}</b> — ${esc(r.course)} — ${esc(r.semester)}<br>
<small>Submission ID: ${esc(r.id)} | DOB: ${esc(r.dob)} | Mobile: ${esc(r.studentMobile)}</small>
<div class="grid" style="margin-top:12px">
<input id="adm${i}" placeholder="Admission Number" value="${esc(r.admission)}">
<input id="reg${i}" placeholder="University Register Number" value="${esc(r.regno)}">
<select id="pay${i}"><option ${r.payment==='Paid'?'selected':''}>Paid</option><option ${r.payment!=='Paid'?'selected':''}>Not Paid</option></select>
</div><div class="actions" style="margin-top:10px"><button onclick="save('${esc(r.id)}',${i})">SAVE OFFICE DETAILS</button>${r.photoUrl?'<a target="_blank" href="'+r.photoUrl+'">Photo</a>':''}${r.signatureUrl?'<a target="_blank" href="'+r.signatureUrl+'">Signature</a>':''}</div></div>`).join('')}
function save(id,i){google.script.run.withSuccessHandler(()=>{alert('Updated successfully');search()}).withFailureHandler(e=>alert(e.message)).updateOfficeRecord(id,document.getElementById('adm'+i).value,document.getElementById('reg'+i).value,document.getElementById('pay'+i).value)}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
