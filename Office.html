
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMCT Registration Office</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;color:#172033}
.header{background:#123d70;color:#fff;padding:20px;text-align:center}
.container{max-width:1150px;margin:25px auto;padding:20px}
.card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 4px 16px #0001;margin-bottom:20px}
.login{max-width:430px;margin:50px auto}.login input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 15px;border:1px solid #ccd5e0;border-radius:7px}
button{background:#123d70;color:#fff;border:0;padding:11px 18px;border-radius:7px;cursor:pointer;font-weight:bold}
.logout{float:right;background:#8b1e1e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;padding:18px;border-radius:10px;text-align:center}.stat b{display:block;font-size:28px;margin-top:5px}
.search{display:flex;gap:10px}.search input{flex:1;padding:12px;border:1px solid #ccd5e0;border-radius:7px}
table{width:100%;border-collapse:collapse;margin-top:15px;background:white}th,td{padding:9px;border-bottom:1px solid #e1e6ed;text-align:left;font-size:13px}th{background:#edf3fa}
.small{font-size:12px;color:#667085}.readonly{font-weight:bold}
#loginMsg,#officeMsg{margin-top:10px;padding:10px;border-radius:6px;display:none}.err{background:#fdeaea;color:#a11}.ok{background:#e7f7ed;color:#126b35}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}table{font-size:11px}}
</style>
</head>
<body>
<div class="header"><h2>KMCT REGISTRATION OFFICE</h2><div>Student ID Card Management — 2026–27</div></div>
<div id="loginView" class="container">
<div class="card login">
<h2>Office Login</h2>
<label>Username</label><input id="username" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" onclick="login()">LOGIN</button>
<div id="loginMsg"></div>
</div>
</div>
<div id="dashboard" class="container" style="display:none">
<button class="logout" onclick="logout()">LOGOUT</button>
<h2>Registration Office Dashboard</h2>
<div class="stats">
<div class="stat">Total Students<b id="total">0</b></div>
<div class="stat">Paid<b id="paid">0</b></div>
<div class="stat">Not Paid<b id="notPaid">0</b></div>
<div class="stat">Completed<b id="completed">0</b></div>
</div>
<div class="card">
<div class="search"><input id="q" placeholder="Search name, submission ID, course, mobile, admission no. or register no." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">SEARCH</button></div>
<div id="officeMsg"></div>
<div id="results"></div>
</div>
</div>
<script>
function msg(id,text,ok){const x=document.getElementById(id);x.style.display='block';x.className=ok?'ok':'err';x.textContent=text;}
function login(){
 const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;
 const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Checking...';
 if(typeof google==='undefined'||!google.script||!google.script.run){msg('loginMsg','This Office page must be opened from the deployed Apps Script Web App URL.',false);b.disabled=false;b.textContent='LOGIN';return;}
 google.script.run.withSuccessHandler(r=>{
   if(r&&r.success){sessionStorage.setItem('kmctOffice','1');showDashboard();}
   else msg('loginMsg','Invalid username or password.',false);
   b.disabled=false;b.textContent='LOGIN';
 }).withFailureHandler(e=>{msg('loginMsg','Login error: '+(e&&e.message?e.message:e),false);b.disabled=false;b.textContent='LOGIN';}).officeLogin(u,p);
}
function showDashboard(){
 document.getElementById('loginView').style.display='none';
 document.getElementById('dashboard').style.display='block';
 loadStats();search();
}
function logout(){sessionStorage.removeItem('kmctOffice');location.reload();}
function loadStats(){google.script.run.withSuccessHandler(s=>{total.textContent=s.total;paid.textContent=s.paid;notPaid.textContent=s.notPaid;completed.textContent=s.completed;}).getOfficeStats();}
function search(){
 const q=document.getElementById('q').value;
 google.script.run.withSuccessHandler(render).withFailureHandler(e=>msg('officeMsg','Search error: '+e.message,false)).searchStudents(q);
}
function render(rows){
 const el=document.getElementById('results');
 if(!rows.length){el.innerHTML='<p>No records found.</p>';return;}
 let h='<table><tr><th>Submission ID</th><th>Student</th><th>Course</th><th>Mobile</th><th>Payment</th><th>Admission No.</th><th>University Reg. No.</th><th>Files</th><th>Action</th></tr>';
 rows.forEach(r=>{
 h+='<tr><td>'+esc(r.submissionId)+'</td><td>'+esc(r.studentName)+'</td><td>'+esc(r.course)+' / '+esc(r.semester)+'</td><td>'+esc(r.studentMobile)+'</td><td class="readonly">'+esc(r.paymentStatus)+'</td><td><input id="a_'+esc(r.submissionId)+'" value="'+esc(r.admissionNumber)+'"></td><td><input id="r_'+esc(r.submissionId)+'" value="'+esc(r.registerNumber)+'"></td><td>'+(r.photo?'<a target="_blank" href="'+r.photo+'">Photo</a> ':'')+(r.signature?'<a target="_blank" href="'+r.signature+'">Signature</a>':'')+'</td><td><button onclick="save(\''+js(r.submissionId)+'\')">SAVE</button></td></tr>';
 });
 h+='</table>';el.innerHTML=h;
}
function save(id){
 const a=document.getElementById('a_'+id).value,r=document.getElementById('r_'+id).value;
 google.script.run.withSuccessHandler(()=>{msg('officeMsg','Office details saved.',true);loadStats();search();}).withFailureHandler(e=>msg('officeMsg','Save error: '+e.message,false)).updateOfficeRecord(id,a,r);
}
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function js(x){return String(x||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
if(sessionStorage.getItem('kmctOffice')==='1')showDashboard();
</script>
</body>
</html>
