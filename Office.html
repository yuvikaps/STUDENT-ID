<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial;background:#f2f6fa;margin:0;color:#17324a}.box{max-width:1150px;margin:25px auto;background:#fff;padding:25px;border-radius:16px}.login{max-width:360px;margin:30px auto}input,button{padding:11px;border-radius:8px;border:1px solid #ccd8e2}input{width:100%;box-sizing:border-box;margin:6px 0}button{background:#0876c9;color:white;font-weight:bold;border:0;cursor:pointer}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef5fa;padding:15px;text-align:center}.stat b{display:block;font-size:24px}.toolbar{display:flex;gap:8px;margin:18px 0}.toolbar input{flex:1}.card{border:1px solid #ddd;border-radius:10px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.paid{color:green;font-weight:bold}.not{color:#c00;font-weight:bold}.links{margin:10px 0}.links a{margin-right:15px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.box{margin:0;border-radius:0}}</style></head><body><div class="box"><h2 style="text-align:center;color:#07579a">KMCT COLLEGE OF ENGINEERING FOR EMERGING TECHNOLOGIES AND MANAGEMENT<br>REGISTRATION OFFICE</h2>
<div id="login" class="login"><h3>Office Login</h3><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">LOGIN</button></div>
<div id="dash" class="hidden"><div class="stats"><div class="stat">Total<b id="t">0</b></div><div class="stat">Paid<b id="pa">0</b></div><div class="stat">Not Paid<b id="np">0</b></div><div class="stat">Completed<b id="co">0</b></div></div><div class="toolbar"><input id="q" placeholder="Search name / ID / course / mobile / admission / register no."><button onclick="search()">SEARCH</button><button onclick="q.value='';search()">ALL</button><button onclick="location.reload()">LOGOUT</button></div><div id="r"></div></div></div>
<script>function login(){google.script.run.withSuccessHandler(x=>{if(x){loginEl();refresh();search()}else alert('Invalid login')}).officeLogin(u.value,p.value)}function loginEl(){login.style.display='none';dash.classList.remove('hidden')}function refresh(){google.script.run.withSuccessHandler(x=>{t.textContent=x.total;pa.textContent=x.paid;np.textContent=x.notPaid;co.textContent=x.completed}).getOfficeStats()}function search(){google.script.run.withSuccessHandler(show).searchStudents(q.value)}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function show(a){r.innerHTML=a.length?a.map((x,i)=>`<div class="card"><b>${esc(x.studentName)}</b> — ${esc(x.course)} — ${esc(x.semester)}<br><small>Submission ID: ${esc(x.id)} | Mobile: ${esc(x.studentMobile)} | Payment: <span class="${x.paymentStatus==='Paid'?'paid':'not'}">${esc(x.paymentStatus)}</span></small><div class="grid"><input id="a${i}" placeholder="Admission Number" value="${esc(x.admission)}"><input id="g${i}" placeholder="University Register Number" value="${esc(x.regno)}"></div><div class="links">${x.photoUrl?`<a target="_blank" href="${esc(x.photoUrl)}">Photo</a>`:''}${x.signatureUrl?`<a target="_blank" href="${esc(x.signatureUrl)}">Signature</a>`:''}</div><button onclick="save('${esc(x.id)}',${i})">SAVE OFFICE DETAILS</button></div>`).join(''):'<p>No records found.</p>'}function save(id,i){google.script.run.withSuccessHandler(()=>{alert('Saved');refresh();search()}).withFailureHandler(e=>alert(e.message)).updateOfficeRecord(id,document.getElementById('a'+i).value,document.getElementById('g'+i).value)}</script></body></html>
