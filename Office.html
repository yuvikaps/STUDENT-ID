<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#f3f7fb;font-family:Arial;color:#17324a}.box{max-width:1150px;margin:25px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 30px #0001}
h1{text-align:center;color:#07579a;font-size:22px;line-height:1.4}.login{max-width:360px;margin:35px auto}.login input,.search{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccd8e2;border-radius:8px}
button{background:#0876c9;color:white;border:0;border-radius:8px;padding:11px 18px;font-weight:bold;cursor:pointer}.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef5fa;padding:15px;text-align:center;border-radius:9px}.stat b{display:block;font-size:24px}
.toolbar{display:flex;gap:8px;margin:18px 0}.toolbar .search{flex:1;margin:0}.card{border:1px solid #dce4ea;border-radius:10px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccd8e2;border-radius:7px}
.paid{color:green;font-weight:bold}.notpaid{color:#c00;font-weight:bold}.links{margin:10px 0}.links a{margin-right:15px;color:#07579a}
@media(max-width:700px){.box{margin:0;border-radius:0}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><div class="box">
<h1>KMCT COLLEGE OF ENGINEERING FOR EMERGING TECHNOLOGIES AND MANAGEMENT<br>REGISTRATION OFFICE</h1>
<div id="login" class="login"><h3>Registration Office Login</h3><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="login()">LOGIN</button></div>
<div id="dashboard" class="hidden">
<div class="stats"><div class="stat">Total Students<b id="total">0</b></div><div class="stat">Paid<b id="paid">0</b></div><div class="stat">Not Paid<b id="notPaid">0</b></div><div class="stat">Completed<b id="completed">0</b></div></div>
<div class="toolbar"><input class="search" id="query" placeholder="Search name / ID / course / mobile / admission / register no."><button onclick="search()">SEARCH</button><button onclick="allStudents()">ALL</button><button onclick="location.reload()">LOGOUT</button></div>
<div id="results"></div></div></div>
<script>
function login(){google.script.run.withSuccessHandler(function(ok){if(ok){document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');refresh();search()}else alert('Invalid username or password.')}).withFailureHandler(function(e){alert(e.message)}).officeLogin(document.getElementById('username').value,document.getElementById('password').value)}
function refresh(){google.script.run.withSuccessHandler(function(s){total.textContent=s.total;paid.textContent=s.paid;notPaid.textContent=s.notPaid;completed.textContent=s.completed}).getOfficeStats()}
function allStudents(){query.value='';search()}
function search(){google.script.run.withSuccessHandler(render).withFailureHandler(function(e){alert(e.message)}).searchStudents(query.value)}
function esc(x){return String(x||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function render(a){results.innerHTML=a.length?a.map(function(x,i){return '<div class="card"><b>'+esc(x.studentName)+'</b> — '+esc(x.course)+' — '+esc(x.semester)+'<br><small>Submission ID: '+esc(x.id)+' | Mobile: '+esc(x.studentMobile)+' | Payment: <span class="'+(x.paymentStatus==='Paid'?'paid':'notpaid')+'">'+esc(x.paymentStatus)+'</span></small><div class="grid"><input id="adm'+i+'" placeholder="Admission Number" value="'+esc(x.admission)+'"><input id="reg'+i+'" placeholder="University Register Number" value="'+esc(x.regno)+'"></div><div class="links">'+(x.photoUrl?'<a target="_blank" href="'+esc(x.photoUrl)+'">View Photo</a>':'')+(x.signatureUrl?'<a target="_blank" href="'+esc(x.signatureUrl)+'">View Signature</a>':'')+'</div><button onclick="saveRecord(\''+esc(x.id)+'\','+i+')">SAVE OFFICE DETAILS</button></div>'}).join(''):'<p>No records found.</p>'}
function saveRecord(id,i){google.script.run.withSuccessHandler(function(){alert('Saved successfully.');refresh();search()}).withFailureHandler(function(e){alert(e.message)}).updateOfficeRecord(id,document.getElementById('adm'+i).value,document.getElementById('reg'+i).value)}
</script></body></html>
